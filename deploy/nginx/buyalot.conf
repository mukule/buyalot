# /etc/nginx/sites-available/buyalot.conf
# Laravel 12 + Inertia (Vue) storefront with SSR, tuned for SEO and Core Web Vitals.
# Replace example.com with the real domain and adjust the PHP-FPM socket path.

# Redirect http + www -> https://example.com (one canonical host)
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    root /var/www/buyalot/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # --- Security headers (also help trust signals) ---
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript
               application/rss+xml image/svg+xml font/woff2;
    # If the brotli module is installed (nginx-module-brotli / ngx_brotli), uncomment:
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css text/xml application/xml application/json application/javascript image/svg+xml;

    client_max_body_size 64m;

    # --- Hashed Vite build assets: cache forever ---
    location ^~ /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Uploaded media (storage symlink) and static images: cache 30 days ---
    location ~* ^/(storage|images)/.*\.(jpe?g|png|gif|webp|avif|svg|ico|mp4|webm)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~* \.(ico|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|css|js)$ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri /index.php?$query_string;
    }

    # robots.txt and sitemaps: served by Laravel if no static file exists
    # (php artisan sitemap:generate writes static copies into public/).
    location ~* ^/(robots\.txt|sitemap.*\.xml)$ {
        expires 1h;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
