<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Seller portal: manage stock, pricing and products">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3eefa"/>
      <stop offset="1" stop-color="#e4d8f4"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6C3BAA"/>
      <stop offset="1" stop-color="#8f63c9"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#bg)"/>
  <circle cx="420" cy="40" r="70" fill="#6C3BAA" opacity=".08"/>
  <circle cx="50" cy="270" r="60" fill="#FF4500" opacity=".07"/>

  <!-- Laptop with seller dashboard -->
  <rect x="78" y="52" width="290" height="180" rx="12" fill="#2d1a4a"/>
  <rect x="88" y="62" width="270" height="160" rx="6" fill="#ffffff"/>
  <!-- sidebar -->
  <rect x="88" y="62" width="58" height="160" rx="6" fill="#6C3BAA"/>
  <rect x="98" y="78" width="38" height="6" rx="3" fill="#ffffff" opacity=".9"/>
  <rect x="98" y="96" width="30" height="5" rx="2.5" fill="#ffffff" opacity=".5"/>
  <rect x="98" y="110" width="34" height="5" rx="2.5" fill="#ffffff" opacity=".5"/>
  <rect x="98" y="124" width="26" height="5" rx="2.5" fill="#FF4500"/>
  <rect x="98" y="138" width="32" height="5" rx="2.5" fill="#ffffff" opacity=".5"/>
  <!-- stat tiles -->
  <rect x="158" y="74" width="58" height="34" rx="5" fill="#f3eefa"/>
  <rect x="164" y="81" width="26" height="4" rx="2" fill="#6C3BAA" opacity=".6"/>
  <rect x="164" y="91" width="38" height="8" rx="2" fill="#6C3BAA"/>
  <rect x="224" y="74" width="58" height="34" rx="5" fill="#f3eefa"/>
  <rect x="230" y="81" width="26" height="4" rx="2" fill="#6C3BAA" opacity=".6"/>
  <rect x="230" y="91" width="30" height="8" rx="2" fill="#FF4500"/>
  <rect x="290" y="74" width="58" height="34" rx="5" fill="#f3eefa"/>
  <rect x="296" y="81" width="26" height="4" rx="2" fill="#6C3BAA" opacity=".6"/>
  <rect x="296" y="91" width="42" height="8" rx="2" fill="#6C3BAA"/>
  <!-- sales chart -->
  <rect x="158" y="116" width="190" height="96" rx="5" fill="#faf8fd"/>
  <rect x="172" y="170" width="16" height="32" rx="3" fill="url(#bar)"/>
  <rect x="196" y="156" width="16" height="46" rx="3" fill="url(#bar)"/>
  <rect x="220" y="162" width="16" height="40" rx="3" fill="url(#bar)"/>
  <rect x="244" y="142" width="16" height="60" rx="3" fill="url(#bar)"/>
  <rect x="268" y="132" width="16" height="70" rx="3" fill="url(#bar)"/>
  <rect x="292" y="124" width="16" height="78" rx="3" fill="#FF4500"/>
  <polyline points="180,164 204,150 228,156 252,136 276,126 300,118" fill="none" stroke="#FF4500" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="300" cy="118" r="4" fill="#FF4500"/>
  <!-- laptop base -->
  <path d="M58 232 H388 L376 248 H70 Z" fill="#4a2580"/>
  <rect x="196" y="232" width="54" height="5" rx="2.5" fill="#2d1a4a"/>

  <!-- Price tag -->
  <g transform="translate(372 96) rotate(14)">
    <path d="M0 0 H54 L70 18 L54 36 H0 Z" fill="#FF4500"/>
    <circle cx="57" cy="18" r="4" fill="#ffffff"/>
    <rect x="9" y="11" width="30" height="5" rx="2.5" fill="#ffffff"/>
    <rect x="9" y="21" width="20" height="5" rx="2.5" fill="#ffffff" opacity=".7"/>
  </g>

  <!-- Stock boxes -->
  <g transform="translate(388 178)">
    <rect x="0" y="22" width="44" height="40" rx="3" fill="#d9b98c"/>
    <rect x="18" y="22" width="8" height="40" fill="#6C3BAA"/>
    <rect x="48" y="30" width="36" height="32" rx="3" fill="#cfa977"/>
    <rect x="62" y="30" width="8" height="32" fill="#FF4500"/>
    <rect x="12" y="-14" width="40" height="36" rx="3" fill="#e3c79f"/>
    <rect x="28" y="-14" width="8" height="36" fill="#6C3BAA"/>
  </g>

  <!-- Check badge -->
  <circle cx="74" cy="78" r="20" fill="#ffffff" stroke="#6C3BAA" stroke-width="3"/>
  <polyline points="65,78 72,85 84,71" fill="none" stroke="#FF4500" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
